name: background_fetch
description: Periodic callbacks in the background for both iOS and Android.  Includes Android Headless implementation.
version: 2.0.1
homepage: https://github.com/transistorsoft/flutter_background_fetch

environment:
  sdk: ^3.6.0
  flutter: ">=3.38.0"
dependencies:
  flutter:
    sdk: flutter

# (WO-011) The plugin's own tests (test/).  A dev_dependency: it does not reach apps that depend on the plugin.
dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.transistorsoft.flutter.backgroundfetch
        pluginClass: BackgroundFetchPlugin
      ios:
        pluginClass: BackgroundFetchPlugin
topics:
  - background-task
  - background
